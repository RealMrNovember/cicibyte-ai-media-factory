[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cicibyte-ai-media-factory"
dynamic = ["version"]
description = "Self-hosted, open-source AI YouTube media factory. Powered by CiciByte Technology."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "CiciByte Technology, Inc." }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162,<0.170",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "argon2-cffi>=23.1",
    "cryptography>=43",
    "httpx>=0.27",
    "typer>=0.12",
    "itsdangerous>=2.2",
    "defusedxml>=0.7",
    "pypdf>=6.1",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "piper-tts>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6"]

[project.scripts]
mf = "mediafactory.cli:app"

[project.urls]
Homepage = "https://cicibyte.com"
Source = "https://github.com/RealMrNovember/cicibyte-ai-media-factory"
Funding = "https://buymeacoffee.com/mikeross"

[tool.setuptools.dynamic]
version = { attr = "mediafactory.__version__" }

[tool.setuptools.packages.find]
where = ["backend"]
include = ["mediafactory", "mediafactory.*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.ruff.lint.isort]
known-first-party = ["mediafactory", "tests"]

[tool.ruff.lint.per-file-ignores]
"backend/mediafactory/db/migrations/versions/*" = ["E501", "W291"]

[tool.setuptools.package-data]
"mediafactory.db" = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]
"mediafactory" = ["web/*"]
