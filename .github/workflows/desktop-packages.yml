name: Desktop packages (macOS, Linux)

# Builds the Mac .dmg and the Linux .AppImage for a release, smoke-tests each (the window must open and close
# by itself) and attaches them with SHA-256 files. The Windows installer is built separately.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build for (e.g. v0.3.2)"
        required: true

permissions:
  contents: write

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[desktop]" pillow
      - name: Build and smoke-test
        run: bash packaging/build_macos.sh
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag || github.ref_name }}" dist/*.dmg dist/*.dmg.sha256 --clobber

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries for Qt WebEngine and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcomposite1 \
            libxdamage1 libxrandr2 libxtst6 libnss3 libasound2 libfontconfig1 libdbus-1-3 file
      - name: Install
        run: python -m pip install -e ".[desktop]" pillow
      - name: appimagetool
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          echo "APPIMAGETOOL=$PWD/appimagetool --appimage-extract-and-run" >> "$GITHUB_ENV"
      - name: Build and smoke-test
        run: bash packaging/build_linux.sh
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag || github.ref_name }}" dist/*.AppImage dist/*.AppImage.sha256 --clobber
