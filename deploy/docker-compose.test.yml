# Throwaway PostgreSQL for the test suite. Not for production.
name: mediafactory-test
services:
  db-test:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: mf
      POSTGRES_PASSWORD: mf
      POSTGRES_DB: mf_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mf -d mf_test"]
      interval: 2s
      retries: 20
